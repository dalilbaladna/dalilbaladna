import os, base64

# Let's see what images we have
files = os.listdir('.')
print(files)
# The user wants "الكود" for the exact image without distortion.
# The previous generated image is watermarked_img_13348496915493388442.jpg or input_file_0.png
# Let's check which image has the exact clean logo
target_img = 'input_file_0.png'
if 'watermarked_img_13348496915493388442.jpg' in files:
    target_img = 'watermarked_img_13348496915493388442.jpg'

with open(target_img, 'rb') as f:
    img_bytes = f.read()

b64_str = base64.b64encode(img_bytes).decode('utf-8')
mime = 'image/jpeg' if target_img.endswith('.jpg') else 'image/png'

svg_code = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <image width="1024" height="1024" href="data:{mime};base64,{b64_str}" preserveAspectRatio="xMidYMid meet" />
</svg>'''

with open('dalil_baladna_exact.svg', 'w', encoding='utf-8') as f:
    f.write(svg_code)

print("Saved dalil_baladna_exact.svg, length:", len(svg_code))
