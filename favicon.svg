<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="150" height="150">
  <defs>
    <!-- تدرج الخلفية البنفسجي -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581673" />
      <stop offset="50%" stop-color="#3d0b54" />
      <stop offset="100%" stop-color="#230432" />
    </linearGradient>

    <!-- تدرج الإضاءة للمجسم -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2d5ec" />
      <stop offset="100%" stop-color="#b196c8" />
    </linearGradient>

    <!-- ظل الشعار -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- خلفية الأيقونة المربعة ذات الحواف الدائرية -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" />

  <!-- مجموعة الشعار المجسم مع الظل -->
  <g filter="url(#shadow)">
    <!-- الشكل الحلزوني ومؤشر الموقع -->
    <path fill="url(#pinGrad)" d="M 200,60 
             C 275,60 295,125 295,170 
             C 295,230 200,300 200,300 
             C 200,300 150,235 150,205 
             C 150,185 165,170 185,170 
             C 205,170 218,185 218,200 
             C 218,208 212,216 202,216 
             C 186,216 182,192 198,186 
             C 202,184 206,188 206,192 
             C 206,204 178,208 178,188 
             C 178,160 218,152 234,176 
             C 250,200 232,246 200,274 
             C 160,238 120,208 120,168 
             C 120,105 160,60 200,60 Z" />

    <!-- الظل الداخلي والتجسيم للالتفاف -->
    <path fill="#8a67aa" opacity="0.35" d="M 200,60 C 275,60 295,125 295,170 C 295,210 245,260 200,300 C 205,270 265,210 265,170 C 265,130 240,85 200,75 Z" />
  </g>

  <!-- النصوص السفلية -->
  <text x="200" y="340" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">
    دليل بلدنا
  </text>
  <text x="200" y="372" font-family="'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#d9c7e8" text-anchor="middle">
    DALIL BALADNA
  </text>
</svg>
